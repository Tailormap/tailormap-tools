on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
    secrets:
      DEPLOY_DOCKER_HOST:
      DEPLOY_DOCKER_HOST_SSH_CERT:
      DEPLOY_DOCKER_HOST_SSH_KEY:
      # Optional token allowed to delete environments (fine-grained PAT or GitHub App token with "Administration: write" on the
      # repository). GITHUB_TOKEN can't delete environments. Without it only the deployments of the PR environment are deleted
      # and the empty environment stays behind.
      DEPLOYMENT_CLEANUP_TOKEN:

jobs:
  undeploy:
    # The environment is only used for its variables and secrets, don't create a deployment for undeploying. See
    # reusable-deploy.yml.
    environment:
      name: ${{ inputs.environment || 'test' }}
      deployment: false
    # The calling workflow must grant these permissions, a reusable workflow can't get more than its caller has.
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    env:
      PR_ENVIRONMENT: ${{ inputs.environment || 'test' }}-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7

      - name: 'Set variables for PR'
        env:
          PR: ${{ github.event.pull_request.number }}
          PROJECT_NAME: ${{ vars.DEPLOY_PROJECT_NAME }}
        run: |
          echo "VERSION_TAG=pr-${PR}" >> $GITHUB_ENV
          echo "COMPOSE_PROJECT_NAME=${PROJECT_NAME}-pr-${PR}" >> $GITHUB_ENV

      - uses: arwynfr/actions-docker-context@v2
        with:
          docker_host: ${{ secrets.DEPLOY_DOCKER_HOST }}
          context_name: 'dev-server'
          ssh_cert: ${{ secrets.DEPLOY_DOCKER_HOST_SSH_CERT }}
          ssh_key: ${{ secrets.DEPLOY_DOCKER_HOST_SSH_KEY }}
          use_context: true

      - name: 'Add known hosts'
        run: |
          DEPLOY_DOCKER_HOST=${{ secrets.DEPLOY_DOCKER_HOST }}
          ssh-keyscan -H ${DEPLOY_DOCKER_HOST##*@} > $HOME/.ssh/known_hosts

      - uses: actions/checkout@v7
        with:
          repository: B3Partners/tailormap-viewer
          path: tailormap-viewer
          sparse-checkout: |
            docker-compose*.yml
          sparse-checkout-cone-mode: false

      - name: 'Remove pull request deployment and image'
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.traefik.yml:ci/docker-compose.pr.yml
          VERSION: ${{ env.VERSION_TAG }}
          TAILORMAP_IMAGE: ${{ vars.DEPLOY_IMAGE_TAG }}
        run: |
          cd tailormap-viewer
          docker compose config
          docker compose down --rmi all --volumes --remove-orphans

      - name: 'Remove GitHub PR environment'
        if: ${{ always() }}
        uses: strumwolf/delete-deployment-environment@v4.0.0
        with:
          token: ${{ secrets.DEPLOYMENT_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
          environment: ${{ env.PR_ENVIRONMENT }}
          onlyRemoveDeployments: ${{ secrets.DEPLOYMENT_CLEANUP_TOKEN == '' }}

      - name: 'Remove GitHub deployments in the main environment'
        # Before PR deployments got their own environment they were created in the main environment. Remove those for PRs that
        # were deployed before that change. This step can be removed once those PRs are closed.
        if: ${{ always() }}
        uses: strumwolf/delete-deployment-environment@v4.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: ${{ inputs.environment || 'test' }}
          onlyRemoveDeployments: true
          ref: ${{ github.head_ref }}
